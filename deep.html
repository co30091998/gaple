<body><div class="wrap">

<section id="home" class="card center">
<h1>🁣 Gaple Guest Room</h1>
<p class="muted">Main berdua dari perangkat berbeda menggunakan kode room. Tidak perlu akun.</p>
<div class="field"><label>Nama Anda</label><input id="name" value="Guest"></div>
<div class="field"><label>Target Poin Kemenangan (dipakai pembuat room)</label>
<select id="targetScore">
<option value="25">25 poin</option>
<option value="50">50 poin</option>
<option value="100" selected>100 poin</option>
<option value="200">200 poin</option>
</select></div>
<button class="primary" onclick="createRoom()">Buat Room</button>
<div style="text-align:center;margin:18px">atau</div>
<div class="field"><label>Kode Room</label><input id="joinCode" placeholder="Contoh: AB7K2" maxlength="5" style="text-transform:uppercase"></div>
<button class="secondary" onclick="joinRoom()">Gabung Room</button>
<p id="homeMsg" class="muted"></p>
</section>

<section id="room" class="card center hidden">
<h2>Room dibuat</h2><p>Bagikan kode ini kepada pemain kedua:</p><div id="roomCode" class="code"></div>
<p id="roomStatus" class="muted">Menunggu pemain kedua...</p>
<button class="secondary" onclick="leaveRoom()">Keluar Room</button>
</section>

<section id="game" class="hidden">
<div class="top"><div><h1>🁣 GAPLE</h1><span id="roomLabel" class="muted"></span></div><button class="secondary" onclick="leaveRoom()">Keluar</button></div>
<div class="game">
<div id="p0" class="card player"></div>
<main>
<div class="board"><div class="ends"><span>Kiri: <b id="left">—</b></span><span>Kanan: <b id="right">—</b></span></div><div id="chain" class="chain"></div><div id="status" class="status"></div></div>
<div class="card" style="margin-top:14px"><b id="turn"></b><div id="hand" class="hand"></div><div id="action" class="muted"></div></div>
</main>

</div></section>

<div id="modal" class="modal hidden"><div class="card"><h2 id="mTitle"></h2><div id="mBody"></div><button class="primary" id="mBtn" onclick="modalAction()">Lanjut</button></div></div>

<script>
/* =========================================================
GAPLE INDONESIA - NETWORKING + GAME
Versi PeerJS untuk GitHub Pages
========================================================= */

let peer = null;
let dc = null;
let role = null;
let code = null;
let state = null;
let myIndex = null;
let connected = false;
let gameStarted = false;
let shownRoundKey = null;
let modalStep = null;

/* ============ LOAD PEERJS ============ */
function loadPeerJS() {
    return new Promise((resolve, reject) => {
        if (typeof Peer !== 'undefined') { resolve(); return; }
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
        script.onload = () => {
            if (typeof Peer !== 'undefined') resolve();
            else reject(new Error('PeerJS gagal dimuat.'));
        };
        script.onerror = () => reject(new Error('Tidak dapat memuat PeerJS.'));
        document.head.appendChild(script);
    });
}

/* ============ UTILITAS ============ */
const tiles = () => {
    let a = [];
    for (let i = 0; i <= 6; i++) {
        for (let j = i; j <= 6; j++) a.push({ a: i, b: j, id: i + '-' + j });
    }
    return a;
};

const shuffle = a => {
    a = [...a];
    for (let i = a.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
};

function rnd() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let result = '';
    for (let i = 0; i < 5; i++) result += chars[Math.floor(Math.random() * chars.length)];
    return result;
}

function msg(x) {
    const el = document.getElementById('homeMsg');
    if (el) el.textContent = x;
}

function send(x) {
    if (!dc) { console.warn('Data connection belum tersedia.'); return false; }
    if (dc.open === false) { console.warn('Data connection belum terbuka.'); return false; }
    try { dc.send(x); return true; }
    catch (err) { console.error('Gagal mengirim data:', err); return false; }
}

/* ============ BUAT PEER ============ */
function createPeer(peerId = null) {
    try {
        peer = peerId ? new Peer(peerId, { debug: 1 }) : new Peer({ debug: 1 });
    } catch (err) {
        console.error(err);
        msg('Gagal membuat koneksi PeerJS.');
        return;
    }

    peer.on('open', id => {
        console.log('Peer berhasil terhubung:', id);
        if (role === 'host') {
            code = id;
            document.getElementById('roomCode').textContent = code;
            document.getElementById('roomStatus').textContent = 'Menunggu pemain kedua...';
        }
        if (role === 'guest') {
            document.getElementById('roomStatus').textContent = 'Menghubungkan ke room ' + code + '...';
            connectToHost();
        }
    });

    peer.on('connection', connection => {
        if (role !== 'host') return;
        if (dc && dc.open) { connection.close(); return; }
        attachDC(connection);
    });

    peer.on('error', err => {
        console.error('PeerJS error:', err);
        if (err.type === 'unavailable-id') {
            if (role === 'host') {
                if (peer) { try { peer.destroy(); } catch (e) {} }
                setTimeout(() => {
                    code = rnd();
                    document.getElementById('roomCode').textContent = code;
                    createPeer(code);
                }, 300);
                return;
            }
        }
        if (err.type === 'peer-unavailable') {
            document.getElementById('roomStatus').textContent = 'Room tidak ditemukan atau sudah ditutup.';
            return;
        }
        if (err.type === 'network') {
            document.getElementById('roomStatus').textContent = 'Koneksi jaringan bermasalah.';
            return;
        }
        document.getElementById('roomStatus').textContent =
            'Koneksi gagal: ' + (err.message || err.type || 'Unknown error');
    });

    peer.on('disconnected', () => {
        if (!connected) {
            document.getElementById('roomStatus').textContent =
                'Koneksi ke server terputus. Mencoba menghubungkan kembali...';
            try { peer.reconnect(); } catch (e) {}
        }
    });

    peer.on('close', () => { connected = false; });
}

/* ============ HUBUNGKAN GUEST -> HOST ============ */
function connectToHost() {
    if (!peer || !code) return;
    try {
        const connection = peer.connect(code, { reliable: true, serialization: 'json' });
        attachDC(connection);
    } catch (err) {
        console.error('Gagal connect:', err);
        document.getElementById('roomStatus').textContent = 'Gagal menghubungkan ke room.';
    }
}

/* ============ DATA CONNECTION ============ */
function attachDC(connection) {
    if (!connection) return;
    dc = connection;

    dc.on('open', () => {
        connected = true;
        document.getElementById('roomStatus').textContent = 'Pemain terhubung!';
        document.getElementById('room').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');

        if (role === 'guest') {
            send({ type: 'hello', name: document.getElementById('name').value.trim() || 'Guest' });
        }
        if (role === 'host' && !gameStarted) startGame();
    });

    dc.on('data', data => {
        try {
            let message = data;
            if (typeof data === 'string') message = JSON.parse(data);
            receive(message);
        } catch (err) { console.error('Data dari lawan tidak valid:', err); }
    });

    dc.on('close', () => {
        connected = false;
        document.getElementById('status').textContent = 'Pemain lain terputus dari permainan.';
    });

    dc.on('error', err => {
        connected = false;
        document.getElementById('roomStatus').textContent = 'Koneksi pemain bermasalah.';
    });
}

/* ============ BUAT / GABUNG ROOM ============ */
async function createRoom() {
    try { await loadPeerJS(); }
    catch (err) { msg('PeerJS gagal dimuat. Periksa koneksi internet.'); console.error(err); return; }

    role = 'host'; myIndex = 0; gameStarted = false;
    code = rnd();
    document.getElementById('roomCode').textContent = code;
    document.getElementById('home').classList.add('hidden');
    document.getElementById('room').classList.remove('hidden');
    document.getElementById('roomStatus').textContent = 'Menghubungkan ke server...';
    createPeer(code);
}

async function joinRoom() {
    const input = (document.getElementById('joinCode').value || '').trim().toUpperCase();
    if (input.length !== 5) { msg('Kode room harus 5 karakter.'); return; }

    try { await loadPeerJS(); }
    catch (err) { msg('PeerJS gagal dimuat. Periksa koneksi internet.'); console.error(err); return; }

    role = 'guest'; myIndex = 1; code = input; gameStarted = false;
    document.getElementById('home').classList.add('hidden');
    document.getElementById('room').classList.remove('hidden');
    document.getElementById('roomCode').textContent = code;
    document.getElementById('roomStatus').textContent = 'Menghubungkan ke room ' + code + '...';
    createPeer();
}

/* ============ AMBIL KARTU CADANGAN ============ */
function drawCard(event) {
    if (event) { event.preventDefault(); event.stopPropagation(); }
    if (!state || myIndex !== state.turn) return;
    if (role !== 'host') { send({ type: 'action', action: { kind: 'draw' } }); return; }
    apply({ kind: 'draw' }, false);
}

/* ============ MULAI GAME ============ */
function startGame() {
    if (gameStarted || role !== 'host') return;
    gameStarted = true;

    const targetEl = document.getElementById('targetScore');
    const target = targetEl ? (parseInt(targetEl.value, 10) || 100) : 100;

    const deck = shuffle(tiles());

    state = {
        players: [
            {
                name: document.getElementById('name').value.trim() || 'Guest',
                hand: deck.slice(0, 7),
                dead: [], score: 0, rounds: 0, lastRoundScore: 0
            },
            {
                name: 'Menunggu...',
                hand: deck.slice(7, 14),
                dead: [], score: 0, rounds: 0, lastRoundScore: 0
            }
        ],
        chain: [],
        stock: deck.slice(14),
        turn: 0,
        starter: 0,
        round: 1,
        forcedDouble: false,
        passCount: 0,
        targetScore: target,
        roundResult: null,
        started: true
    };

    showGame();
    send({ type: 'state', state: state });
}

function showGame() {
    document.getElementById('room').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    render();
}

/* ============ TERIMA DATA DARI LAWAN ============ */
function receive(m) {
    if (!m || !m.type) return;

    if (m.type === 'hello') {
        if (role !== 'host' || !state) return;
        state.players[1].name = m.name || 'Guest';
        send({ type: 'state', state: state });
        render();
        return;
    }

    if (m.type === 'state') {
        if (!m.state) return;
        const hadResult = state && state.roundResult;
        state = m.state;
        gameStarted = true;
        showGame();
        if (!state.roundResult && hadResult) {
            hideModal();
            shownRoundKey = null;
        }
        return;
    }

    if (m.type === 'action') {
        if (!state) return;
        apply(m.action, true);
        return;
    }

    if (m.type === 'ping') { send({ type: 'pong' }); return; }
}

/* ============ CEK DOUBLE ============ */
function hasDouble(p) { return p.hand.some(t => t.a === t.b); }

/* ============ CEK KARTU BOLEH DIMAINKAN ============ */
function can(t) {
    if (!state) return false;
    if (!state.chain.length) return !state.forcedDouble || t.a === t.b;
    const l = state.chain[0].a;
    const r = state.chain[state.chain.length - 1].b;
    return (t.a === l || t.b === l || t.a === r || t.b === r);
}

/* ============ MAIN KARTU ============ */
function play(id) {
    if (!state || myIndex !== state.turn) return;
    const t = state.players[myIndex].hand.find(x => x.id === id);
    if (!t || !can(t)) return;
    apply({ kind: 'play', id: id }, false);
}

/* ============ BUANG KARTU ============ */
function discard(id) {
    if (!state || myIndex !== state.turn) return;
    const p = state.players[myIndex];
    if (p.hand.some(can)) return;
    apply({ kind: 'discard', id: id }, false);
}

/* ============ TERAPKAN AKSI ============ */
function apply(a, remote) {
    if (!state || !a) return;
    const p = state.players[state.turn];
    if (!p) return;

    if (a.kind === 'draw') {
        if (p.hand.some(can) || !state.stock.length) return;
        p.hand.push(state.stock.shift());
        if (p.hand.some(can)) {
            state.passCount = 0;
        } else if (!state.stock.length) {
            state.turn = 1 - state.turn;
            state.passCount = (state.passCount || 0) + 1;
            if (state.passCount >= 2) { finish(state.turn, 'gap'); return; }
        }
        render();
        if (role === 'host') send({ type: 'state', state: state });
        else if (!remote) send({ type: 'action', action: a });
        return;
    }

    if (a.kind === 'pass') {
        if (p.hand.some(can) || state.stock.length) return;
        state.passCount = (state.passCount || 0) + 1;
        state.turn = 1 - state.turn;
        if (state.passCount >= 2) { finish(state.turn, 'gap'); return; }
        render();
        if (role === 'host') send({ type: 'state', state: state });
        else if (!remote) send({ type: 'action', action: a });
        return;
    }

    if (a.kind === 'play') {
        const t = p.hand.find(x => x.id === a.id);
        if (!t || !can(t)) return;

        if (!state.chain.length) state.chain = [t];
        else {
            const l = state.chain[0].a;
            const r = state.chain[state.chain.length - 1].b;
            if (t.b === l) state.chain.unshift(t);
            else if (t.a === l) state.chain.unshift({ a: t.b, b: t.a, id: t.id });
            else if (t.a === r) state.chain.push(t);
            else if (t.b === r) state.chain.push({ a: t.b, b: t.a, id: t.id });
            else return;
        }

        p.hand = p.hand.filter(x => x.id !== t.id);
        state.forcedDouble = false;
        state.passCount = 0;

        if (!p.hand.length) { finish(state.turn, 'habis'); return; }
        state.turn = 1 - state.turn;
    }

    render();
    if (role === 'host') send({ type: 'state', state: state });
    else if (!remote) send({ type: 'action', action: a });
}

/* =========================================================
SELESAI RONDE — hasil disimpan ke state.roundResult
supaya kedua pemain menerima pop-up yang sama.
========================================================= */
function finish(w, reason) {
    if (!state || state.roundResult) return;

    const remaining = state.players.map(p =>
        (p.hand || []).reduce((sum, t) => sum + t.a + t.b, 0)
    );

    let winner = w;
    if (remaining[0] !== 0 || remaining[1] !== 0) {
        winner = remaining[0] === remaining[1]
            ? tieWinner(0, 1)
            : (remaining[0] < remaining[1] ? 0 : 1);
    }

    const loser = 1 - winner;
    const points = remaining[loser];
    const target = state.targetScore || 100;

    state.players[winner].score = (state.players[winner].score || 0) + points;
    state.players[winner].rounds = (state.players[winner].rounds || 0) + 1;
    state.players[winner].lastRoundScore = points;
    state.players[loser].lastRoundScore = 0;
    state.starter = winner;

    state.roundResult = {
        round: state.round,
        winner: winner,
        loser: loser,
        points: points,
        gap: (reason === 'gap'),
        target: target,
        matchOver: state.players[winner].score >= target
    };

    render();
    send({ type: 'state', state: state });
}

/* ============ PENENTU PEMENANG JIKA SKOR SAMA ============ */
function tieWinner(a, b) {
    const key = i => state.players[i].hand
        .concat(state.players[i].dead)
        .map(t => ({ s: t.a + t.b, l: Math.min(t.a, t.b) }))
        .sort((x, y) => x.s - y.s || x.l - y.l)[0] || { s: 0, l: 0 };
    const x = key(a), y = key(b);
    return x.s !== y.s ? (x.s < y.s ? a : b) : (x.l <= y.l ? a : b);
}

/* ============ MODAL ============ */
function showModal(title, body, btnText, step) {
    document.getElementById('mTitle').textContent = title;
    document.getElementById('mBody').innerHTML = body;
    document.getElementById('mBtn').textContent = btnText;
    modalStep = step;
    document.getElementById('modal').classList.remove('hidden');
}

function hideModal() {
    document.getElementById('modal').classList.add('hidden');
    modalStep = null;
}

function checkRoundResult() {
    if (!state || !state.roundResult) return;
    const r = state.roundResult;
    const key = r.round + '|' + r.winner + '|' + r.points + '|' + (r.gap ? 'g' : 'n');
    if (shownRoundKey === key) return;
    shownRoundKey = key;

    if (r.gap) {
        showModal('GAP!',
            '<h3 style="margin-top:0">🛑 GAP</h3>' +
            '<p>Kedua pemain tidak memiliki kartu yang cocok dan kartu cadangan sudah habis.</p>' +
            '<p>Ronde dihentikan (GAP). Poin akan dihitung dari sisa kartu.</p>',
            'Lihat Hasil', 'gap');
    } else {
        showResultModal();
    }
}

function showResultModal() {
    const r = state.roundResult;
    const mine = myIndex === r.winner;
    const P = state.players;

    if (r.matchOver) {
        showModal('Permainan Selesai',
            '<h3>' + (mine ? '🎉 Anda menang!' : '😔 Anda kalah!') + '</h3>' +
            '<p><b>' + P[r.winner].name + '</b> mencapai <b>' + P[r.winner].score +
            ' poin</b> (target ' + r.target + ' poin).</p>' +
            '<p>' + P[0].name + ': <b>' + P[0].score + '</b> poin<br>' +
            P[1].name + ': <b>' + P[1].score + '</b> poin</p>' +
            '<p>' + (mine ? 'Selamat, Anda pemenang permainan!' : 'Permainan telah berakhir.') + '</p>',
            'Selesai', 'result');
    } else {
        showModal('Ronde Selesai',
            '<h3>' + (mine ? '🎉 Anda menang ronde ini!' : '😔 Anda kalah ronde ini.') + '</h3>' +
            '<p>' + (mine
                ? 'Anda mendapatkan <b>' + r.points + ' poin</b>.'
                : 'Lawan mendapatkan <b>' + r.points + ' poin</b>.') + '</p>' +
            '<p>Skor sementara:<br>' +
            P[0].name + ': <b>' + P[0].score + '</b> poin<br>' +
            P[1].name + ': <b>' + P[1].score + '</b> poin</p>' +
            '<p>Target kemenangan: <b>' + r.target + ' poin</b>.</p>',
            'Ronde Berikutnya', 'result');
    }
}

function modalAction() {
    if (modalStep === 'gap') {
        hideModal();
        if (state && state.roundResult) showResultModal();
        return;
    }
    // step === 'result'
    const r = state && state.roundResult;
    hideModal();
    if (!r || r.matchOver) return;
    if (role !== 'host') return; // guest menunggu host membagikan kartu
    nextRound();
}

/* ============ MULAI RONDE BARU (HOST) ============ */
function nextRound() {
    if (!state || role !== 'host' || !state.roundResult) return;

    const deck = shuffle(tiles());
    state.players[0].hand = deck.slice(0, 7);
    state.players[1].hand = deck.slice(7, 14);
    state.players.forEach(p => { p.dead = []; p.lastRoundScore = 0; });
    state.chain = [];
    state.stock = deck.slice(14);
    state.passCount = 0;
    state.turn = state.starter;
    state.forcedDouble = true;
    if (!hasDouble(state.players[state.turn])) state.turn = 1 - state.turn;

    state.roundResult = null;
    state.round = (state.round || 1) + 1;
    shownRoundKey = null;

    render();
    send({ type: 'state', state: state });
}

/* =========================================================
RENDER KARTU
========================================================= */
function pipHalf(n) {
    const pos = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
    return (pos[n] || []).map(i => '<span class="pip p' + i + '"></span>').join('');
}

/* =========================================================
LAYOUT MEJA — POLA ULAR KE BAWAH
Kartu horizontal 82x48, kartu vertikal 48x82.
Baris: 7 kartu horizontal + 1 vertikal penghubung.
========================================================= */
const T_LONG = 82, T_SHORT = 48;
const PER_ROW = 7;
const ROW_STEP = 130;                       // jarak antar baris ke bawah
const CHAIN_W = PER_ROW * T_LONG + T_SHORT; // 622

function chainPosition(i) {
    const block = Math.floor(i / (PER_ROW + 1));
    const pos = i % (PER_ROW + 1);
    const y0 = block * ROW_STEP;
    const rightward = (block % 2 === 0);

    if (pos < PER_ROW) {
        const x = rightward ? pos * T_LONG : (PER_ROW - 1 - pos) * T_LONG;
        return { x: x, y: y0, horizontal: true, flip: !rightward };
    }
    // kartu vertikal penghubung di ujung baris
    const x = rightward ? PER_ROW * T_LONG : 0;
    return { x: x, y: y0 + T_SHORT, horizontal: false, flip: false };
}

function tile(t, click, disabled, horizontal, pos) {
    const place = pos ? ' style="left:' + pos.x + 'px;top:' + pos.y + 'px;z-index:' + (horizontal ? 1 : 3) + '"' : '';
    const cls = horizontal ? 'middle ' : '';
    const flip = (pos && pos.flip) ? 'flip ' : '';
    return '<div class="tile ' + (click ? 'click ' : '') + (disabled ? 'disabled ' : '') + cls + flip + '"' + place +
        (click && !disabled ? ' onclick="play(\'' + t.id + '\')"' : '') + '>' +
        '<div class="half">' + pipHalf(t.a) + '</div><div class="half">' + pipHalf(t.b) + '</div></div>';
}

/* ============ RENDER GAME ============ */
function render() {
    if (!state) return;

    // Info pemain
    state.players.forEach((p, i) => {
        document.getElementById('p' + i).innerHTML =
            '<h3>' + p.name + ' ' + (state.turn === i ? '🟡' : '') + '</h3>' +
            '<div class="score">' +
            'Kartu: <b>' + p.hand.length + '</b><br>' +
            'Cadangan: <b>' + (state.stock ? state.stock.length : 0) + '</b><br>' +
            'Menang ronde: <b>' + p.rounds + '</b><br>' +
            'Poin: <b>' + p.score + '</b>' +
            '</div>';
    });

    // Meja
    const chainEl = document.getElementById('chain');
    if (state.chain.length) {
        chainEl.innerHTML = state.chain.map((t, i) => {
            const pos = chainPosition(i);
            return tile(t, false, i !== 0 && i !== state.chain.length - 1, pos.horizontal, pos);
        }).join('');

        const last = state.chain.length - 1;
        const block = Math.floor(last / (PER_ROW + 1));
        const pos = last % (PER_ROW + 1);
        const h = block * ROW_STEP + (pos === PER_ROW ? ROW_STEP : T_SHORT) + 30;
        chainEl.style.height = Math.max(h, 300) + 'px';
    } else {
        chainEl.innerHTML = '<span class="muted">Meja kosong</span>';
        chainEl.style.height = '120px';
    }

    document.getElementById('left').textContent = state.chain.length ? state.chain[0].a : '—';
    document.getElementById('right').textContent = state.chain.length ? state.chain[state.chain.length - 1].b : '—';

    const p = state.players[myIndex];
    if (!p) return;

    const playable = p.hand.filter(can);
    const mine = state.turn === myIndex;

    document.getElementById('turn').textContent =
        mine ? 'Giliran Anda — ' + p.name : 'Giliran ' + state.players[state.turn].name;

    document.getElementById('status').textContent =
        mine ? (playable.length ? 'Pilih kartu yang cocok.' : 'Tidak ada yang cocok: pilih kartu untuk dibuang.')
             : 'Menunggu giliran lawan...';

    if (mine) {
        document.getElementById('hand').innerHTML = p.hand.map(t => {
            const isPlayable = playable.some(x => x.id === t.id);
            return tile(t, true, !isPlayable);
        }).join('');
    } else {
        document.getElementById('hand').innerHTML = p.hand.map(t => tile(t, false, false)).join('');
    }

    // Kartu cadangan / tombol lewat
    const oldStock = document.getElementById('stockArea');
    if (oldStock) oldStock.remove();

    if (mine && !playable.length) {
        const area = document.createElement('div');
        area.id = 'stockArea'; area.className = 'stock';
        if (state.stock.length) {
            const visible = Math.min(9, state.stock.length);
            let cards = '<div class="stock-stack">';
            for (let i = 0; i < visible; i++) {
                cards += '<button type="button" class="stock-card" style="--i:' + i + '" onclick="drawCard(event)" aria-label="Pilih kartu cadangan"><span class="back-mark">◆</span></button>';
            }
            cards += '</div><div class="stock-count">' + state.stock.length + ' kartu cadangan • pilih satu</div>';
            area.innerHTML = cards;
            document.getElementById('action').textContent = 'Tidak ada kartu yang cocok. Pilih satu kartu cadangan. Jika belum cocok, pilih lagi.';
        } else {
            area.innerHTML = '<span class="muted">Tidak ada kartu cadangan.</span>';
            document.getElementById('action').textContent = 'Tidak ada kartu yang cocok dan cadangan habis. Anda harus Lewat.';
            const btn = document.createElement('button');
            btn.className = 'secondary pass-btn'; btn.textContent = 'Lewat';
            btn.onclick = () => apply({ kind: 'pass' }, false);
            area.appendChild(btn);
        }
        document.getElementById('hand').parentElement.appendChild(area);
    } else {
        document.getElementById('action').textContent = mine ? 'Pilih kartu yang cocok.' : 'Menunggu giliran lawan...';
    }

    document.getElementById('roomLabel').textContent =
        'Room: ' + code + ' • Target: ' + (state.targetScore || 100) + ' poin';

    // Cek apakah ada hasil ronde yang harus ditampilkan
    checkRoundResult();
}

/* ============ KELUAR ROOM ============ */
function leaveRoom() {
    connected = false;
    gameStarted = false;
    try { if (dc) dc.close(); } catch (e) {}
    try { if (peer) peer.destroy(); } catch (e) {}
    location.reload();
}
