<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaple</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(ellipse at top,#1b7a43 0%,#126637 40%,#0b4a28 75%,#082a17 100%);color:#e7ecef}
body{display:flex;align-items:center;justify-content:center;padding:32px 18px;min-height:100vh}
.wrap{max-width:1000px;width:100%}
.header{text-align:center;margin-bottom:40px}
.header h1{font-size:clamp(38px,7vw,64px);margin:0;font-weight:900;letter-spacing:2px;color:#f4c95d;text-shadow:0 4px 0 #2c180d,0 8px 24px rgba(0,0,0,.6)}
.header .sub{margin:14px 0 0;color:#cfe3d7;font-size:clamp(15px,2.4vw,19px);letter-spacing:.5px;opacity:.9}
.header .divider{width:80px;height:4px;margin:18px auto 0;background:#f4c95d;border-radius:4px;box-shadow:0 0 16px rgba(244,201,93,.6)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:8px}
.card{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:34px 18px;border-radius:20px;background:linear-gradient(160deg,#1f2a30 0%,#141c21 100%);border:1px solid #2f3a41;color:#e7ecef;text-decoration:none;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;box-shadow:0 10px 25px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(244,201,93,.18),transparent 62%);opacity:0;transition:opacity .2s}
.card:hover{transform:translateY(-6px);border-color:#f4c95d;box-shadow:0 18px 34px rgba(0,0,0,.55),0 0 0 2px rgba(244,201,93,.35)}
.card:hover::before{opacity:1}
.card .icon{font-size:38px;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.card .name{font-size:22px;font-weight:800;letter-spacing:1px;color:#f4c95d;text-align:center;word-break:break-word}
.card .desc{font-size:12px;color:#aeb8bc;text-align:center;letter-spacing:.4px}
.card:active{transform:translateY(-2px) scale(.99)}
.footer{text-align:center;margin-top:38px;color:#8ea39a;font-size:13px;letter-spacing:.4px}
@media(max-width:520px){.card{padding:26px 14px}.card .name{font-size:19px}.card .icon{font-size:32px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <h1>GAPLE</h1>
    <p class="sub">Silahkan Pilih Versi</p>
    <div class="divider"></div>
  </header>

  <main class="grid">
    <a class="card" href="deep.html">
      <span class="icon">🀄</span>
      <span class="name">deep</span>
      <span class="desc">Versi Deep</span>
    </a>

    <a class="card" href="deep2.html">
      <span class="icon">🀄</span>
      <span class="name">deep2</span>
      <span class="desc">Versi Deep 2</span>
    </a>

    <a class="card" href="gpt.html">
      <span class="icon">🎴</span>
      <span class="name">gpt</span>
      <span class="desc">Versi GPT</span>
    </a>

    <a class="card" href="gpt2.html">
      <span class="icon">🎴</span>
      <span class="name">gpt2</span>
      <span class="desc">Versi GPT 2</span>
    </a>

    <a class="card" href="v1.html">
      <span class="icon">🁣</span>
      <span class="name">v1</span>
      <span class="desc">Versi 1</span>
    </a>
  </main>

  <footer class="footer">Pilih salah satu versi untuk mulai bermain</footer>
</div>
</body>
</html>
