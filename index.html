<script>
function drawReserve(){
    if (typeof state === 'undefined') return;
    if (typeof state.turn !== 'undefined' && typeof myIndex !== 'undefined' && state.turn !== myIndex) return;
    if (!state.reserve || state.reserve.length === 0) {
        if (typeof render === 'function') render();
        return;
    }

    // Take exactly one reserve card.
    const card = state.reserve.pop();

    // Add it to the current player's hand.
    if (state.hands && typeof myIndex !== 'undefined' && state.hands[myIndex]) {
        state.hands[myIndex].push(card);
    } else if (state.players && typeof myIndex !== 'undefined' && state.players[myIndex] && state.players[myIndex].hand) {
        state.players[myIndex].hand.push(card);
    }

    // Re-render immediately.
    if (typeof render === 'function') render();

    // Keep multiplayer state synchronized through the existing transport.
    if (typeof role !== 'undefined' && role === 'host') {
        if (typeof send === 'function') send({type:'state', state:state});
    } else if (typeof send === 'function') {
        send({type:'draw'});
    }
}
</script>

<script>
/* =========================================================
GAPLE INDONESIA - NETWORKING + GAME
Versi PeerJS untuk GitHub Pages

Cara kerja:
Player 1:

* Membuat room
* Kode room menjadi Peer ID
* Menunggu Player 2

Player 2:

* Memasukkan kode room
* Terhubung ke Peer Player 1
* Game dimulai

Tidak menggunakan WebSocket Postman Echo.
========================================================= */

let peer = null;
let dc = null;
let role = null;
let code = null;
let state = null;
let myIndex = null;
let connected = false;
let gameStarted = false;

/* =========================================================
LOAD PEERJS OTOMATIS
Tidak perlu mengubah HTML
========================================================= */

function loadPeerJS() {
return new Promise((resolve, reject) => {

    if (typeof Peer !== 'undefined') {
        resolve();
        return;
    }

    const script = document.createElement('script');

    script.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';

    script.onload = () => {
        if (typeof Peer !== 'undefined') {
            resolve();
        } else {
            reject(new Error('PeerJS gagal dimuat.'));
        }
    };

    script.onerror = () => {
        reject(new Error('Tidak dapat memuat PeerJS.'));
    };

    document.head.appendChild(script);
});

}

/* =========================================================
UTILITAS
========================================================= */

const tiles = () => {
let a = [];

for (let i = 0; i <= 6; i++) {
    for (let j = i; j <= 6; j++) {
        a.push({
            a: i,
            b: j,
            id: i + '-' + j
        });
    }
}

return a;

};

const shuffle = a => {
a = [...a];

for (let i = a.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));

    [a[i], a[j]] = [a[j], a[i]];
}

return a;

};

/*
Membuat kode room 5 karakter.
*/
function rnd() {

const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

let result = '';

for (let i = 0; i < 5; i++) {
    result += chars[Math.floor(Math.random() * chars.length)];
}

return result;

}

/*
Menampilkan pesan di halaman awal.
*/
function msg(x) {
const el = document.getElementById('homeMsg');

if (el) {
    el.textContent = x;
}

}

/*
Mengirim data ke lawan.
*/
function send(x) {

if (!dc) {
    console.warn('Data connection belum tersedia.');
    return false;
}

if (dc.open === false) {
    console.warn('Data connection belum terbuka.');
    return false;
}

try {
    dc.send(x);
    return true;
} catch (err) {
    console.error('Gagal mengirim data:', err);
    return false;
}

}

/* =========================================================
BUAT PEER
========================================================= */

function createPeer(peerId = null) {

try {

    if (peerId) {
        peer = new Peer(peerId, {
            debug: 1
        });
    } else {
        peer = new Peer({
            debug: 1
        });
    }

} catch (err) {

    console.error(err);

    msg('Gagal membuat koneksi PeerJS.');

    return;
}


/*
   Peer berhasil terhubung ke PeerServer.
*/
peer.on('open', id => {

    console.log('Peer berhasil terhubung:', id);

    /*
       HOST
    */
    if (role === 'host') {

        code = id;

        document.getElementById('roomCode').textContent = code;

        document.getElementById('roomStatus').textContent =
            'Menunggu pemain kedua...';

        console.log('Room aktif:', code);
    }


    /*
       GUEST
    */
    if (role === 'guest') {

        document.getElementById('roomStatus').textContent =
            'Menghubungkan ke room ' + code + '...';

        connectToHost();
    }
});


/*
   HOST menerima koneksi dari Player 2.
*/
peer.on('connection', connection => {

    console.log('Player 2 mencoba masuk:', connection.peer);

    if (role !== 'host') {
        return;
    }

    if (dc && dc.open) {
        console.warn('Sudah ada pemain yang terhubung.');
        connection.close();
        return;
    }

    attachDC(connection);
});


/*
   Error PeerJS.
*/
peer.on('error', err => {

    console.error('PeerJS error:', err);

    if (err.type === 'unavailable-id') {

        if (role === 'host') {

            /*
               Kemungkinan kode room sedang dipakai.
               Buat kode baru.
            */

            console.warn('Kode room sudah digunakan.');

            if (peer) {
                try {
                    peer.destroy();
                } catch (e) {}
            }

            setTimeout(() => {

                code = rnd();

                document.getElementById('roomCode').textContent = code;

                createPeer(code);

            }, 300);

            return;
        }
    }


    if (err.type === 'peer-unavailable') {

        document.getElementById('roomStatus').textContent =
            'Room tidak ditemukan atau sudah ditutup.';

        return;
    }


    if (err.type === 'network') {

        document.getElementById('roomStatus').textContent =
            'Koneksi jaringan bermasalah.';

        return;
    }


    document.getElementById('roomStatus').textContent =
        'Koneksi gagal: ' + (err.message || err.type || 'Unknown error');
});


/*
   Peer terputus.
*/
peer.on('disconnected', () => {

    console.warn('PeerServer terputus.');

    if (!connected) {

        document.getElementById('roomStatus').textContent =
            'Koneksi ke server terputus. Mencoba menghubungkan kembali...';

        try {
            peer.reconnect();
        } catch (e) {
            console.error(e);
        }
    }
});


/*
   Peer ditutup.
*/
peer.on('close', () => {

    connected = false;

    console.log('Peer ditutup.');
});

}

/* =========================================================
HUBUNGKAN PLAYER 2 KE PLAYER 1
========================================================= */

function connectToHost() {

if (!peer) {
    return;
}

if (!code) {
    return;
}

console.log('Menghubungkan ke room:', code);

try {

    const connection = peer.connect(code, {
        reliable: true,
        serialization: 'json'
    });

    attachDC(connection);

} catch (err) {

    console.error('Gagal connect:', err);

    document.getElementById('roomStatus').textContent =
        'Gagal menghubungkan ke room.';
}

}

/* =========================================================
DATA CONNECTION
========================================================= */

function attachDC(connection) {

if (!connection) {
    return;
}

dc = connection;

dc.on('open', () => {

    console.log('DataChannel terbuka.');

    connected = true;

    document.getElementById('roomStatus').textContent =
        'Pemain terhubung!';

    /*
       Pindahkan dari halaman room ke game.
    */
    document.getElementById('room').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');


    /*
       Guest mengirim nama ke host.
    */
    if (role === 'guest') {

        send({
            type: 'hello',
            name:
                document.getElementById('name').value.trim() ||
                'Guest'
        });
    }


    /*
       HOST memulai game setelah Player 2 benar-benar
       terhubung.
    */
    if (role === 'host' && !gameStarted) {

        startGame();
    }
});


dc.on('data', data => {

    try {

        /*
           PeerJS sudah bisa mengirim object JSON.
           Tetapi tetap mendukung string agar aman.
        */

        let message = data;

        if (typeof data === 'string') {
            message = JSON.parse(data);
        }

        receive(message);

    } catch (err) {

        console.error('Data dari lawan tidak valid:', err);
    }
});


dc.on('close', () => {

    connected = false;

    console.warn('Player lain terputus.');

    document.getElementById('status').textContent =
        'Pemain lain terputus dari permainan.';
});


dc.on('error', err => {

    console.error('Data connection error:', err);

    connected = false;

    document.getElementById('roomStatus').textContent =
        'Koneksi pemain bermasalah.';
});

}

/* =========================================================
BUAT ROOM
========================================================= */

async function createRoom() {

try {

    await loadPeerJS();

} catch (err) {

    msg('PeerJS gagal dimuat. Periksa koneksi internet.');

    console.error(err);

    return;
}


role = 'host';

myIndex = 0;

gameStarted = false;

/*
   Kode room dibuat sebagai Peer ID.
*/
code = rnd();

document.getElementById('roomCode').textContent = code;

document.getElementById('home').classList.add('hidden');

document.getElementById('room').classList.remove('hidden');

document.getElementById('roomStatus').textContent =
    'Menghubungkan ke server...';


/*
   Peer ID = kode room.
*/
createPeer(code);

}

/* =========================================================
GABUNG ROOM
========================================================= */

async function joinRoom() {

const input =
    (document.getElementById('joinCode').value || '')
    .trim()
    .toUpperCase();


if (input.length !== 5) {

    msg('Kode room harus 5 karakter.');

    return;
}


try {

    await loadPeerJS();

} catch (err) {

    msg('PeerJS gagal dimuat. Periksa koneksi internet.');

    console.error(err);

    return;
}


role = 'guest';

myIndex = 1;

code = input;

gameStarted = false;

document.getElementById('home').classList.add('hidden');

document.getElementById('room').classList.remove('hidden');

document.getElementById('roomCode').textContent = code;

document.getElementById('roomStatus').textContent =
    'Menghubungkan ke room ' + code + '...';


/*
   Guest mendapatkan Peer ID acak.
*/
createPeer();

}

/* =========================================================
MEMULAI GAME
========================================================= */

function startGame() {

if (gameStarted) {
    return;
}

if (role !== 'host') {
    return;
}

gameStarted = true;


const deck = shuffle(tiles());


state = {

    players: [

        {
            name:
                document.getElementById('name').value.trim() ||
                'Guest',

            hand: deck.slice(0, 7),

            dead: [],

            score: 0,

            rounds: 0
        },

        {
            name: 'Menunggu...',

            hand: deck.slice(7, 14),

            dead: [],

            score: 0,

            rounds: 0
        }
    ],

    chain: [],

    stock: deck.slice(14),

    turn: 0,

    starter: 0,

    round: 1,

    forcedDouble: false,

    passCount: 0,

    started: true
};


showGame();

/*
   Kirim state awal ke Player 2.
*/
send({
    type: 'state',
    state: state
});

}

/* =========================================================
TAMPILKAN GAME
========================================================= */

function showGame() {

document.getElementById('room').classList.add('hidden');

document.getElementById('game').classList.remove('hidden');

render();

}

/* =========================================================
TERIMA DATA DARI LAWAN
========================================================= */

function receive(m) {

if (!m || !m.type) {
    return;
}


/*
   Player 2 mengirim nama.
*/
if (m.type === 'hello') {

    if (role !== 'host') {
        return;
    }

    if (!state) {
        return;
    }


    state.players[1].name =
        m.name || 'Guest';


    /*
       Host mengirim state terbaru
       setelah nama Player 2 diterima.
    */
    send({
        type: 'state',
        state: state
    });


    render();

    return;
}


/*
   Sinkronisasi state.
*/
if (m.type === 'state') {

    state = m.state;

    if (!state) {
        return;
    }

    gameStarted = true;

    showGame();

    return;
}


/*
   Aksi pemain.
*/
if (m.type === 'action') {

    if (!state) {
        return;
    }

    apply(m.action, true);

    return;
}


/*
   Ping untuk menjaga koneksi.
*/
if (m.type === 'ping') {

    send({
        type: 'pong'
    });

    return;
}

}

/* =========================================================
CEK DOUBLE
========================================================= */

function hasDouble(p) {

return p.hand.some(t => t.a === t.b);

}

/* =========================================================
CEK KARTU BOLEH DIMAINKAN
========================================================= */

function can(t) {

if (!state) {
    return false;
}


/*
   Meja kosong.
*/
if (!state.chain.length) {

    return !state.forcedDouble ||
           t.a === t.b;
}


const l = state.chain[0].a;

const r =
    state.chain[state.chain.length - 1].b;


return (
    t.a === l ||
    t.b === l ||
    t.a === r ||
    t.b === r
);

}

/* =========================================================
MAIN KARTU
========================================================= */

function play(id) {

if (!state) {
    return;
}

if (myIndex !== state.turn) {
    return;
}


const t =
    state.players[myIndex]
    .hand
    .find(x => x.id === id);


if (!t) {
    return;
}


if (!can(t)) {
    return;
}


apply(
    {
        kind: 'play',
        id: id
    },
    false
);

}

/* =========================================================
BUANG KARTU
========================================================= */

function discard(id) {

if (!state) {
    return;
}

if (myIndex !== state.turn) {
    return;
}


const p =
    state.players[myIndex];


/*
   Tidak boleh discard jika masih ada kartu
   yang bisa dimainkan.
*/
if (p.hand.some(can)) {
    return;
}


apply(
    {
        kind: 'discard',
        id: id
    },
    false
);

}

/* =========================================================
TERAPKAN AKSI
========================================================= */

function apply(a, remote) {

if (!state || !a) return;
const p = state.players[state.turn];
if (!p) return;

if (a.kind === 'draw') {
    if (p.hand.some(can) || !state.stock.length) return;
    p.hand.push(state.stock.shift());

    if (p.hand.some(can)) {
        state.passCount = 0;
    } else if (!state.stock.length) {
        state.turn = 1 - state.turn;
        state.passCount = (state.passCount || 0) + 1;
        if (state.passCount >= 2) { finish(state.turn); return; }
    }

    render();
    if (role === 'host') send({ type: 'state', state: state });
    else if (!remote) send({ type: 'action', action: a });
    return;
}

if (a.kind === 'pass') {
    if (p.hand.some(can) || state.stock.length) return;
    state.passCount = (state.passCount || 0) + 1;
    state.turn = 1 - state.turn;
    if (state.passCount >= 2) { finish(state.turn); return; }
    render();
    if (role === 'host') send({ type: 'state', state: state });
    else if (!remote) send({ type: 'action', action: a });
    return;
}

if (a.kind === 'play') {
    const t = p.hand.find(x => x.id === a.id);
    if (!t || !can(t)) return;

    if (!state.chain.length) state.chain = [t];
    else {
        const l = state.chain[0].a;
        const r = state.chain[state.chain.length - 1].b;
        if (t.b === l) state.chain.unshift(t);
        else if (t.a === l) state.chain.unshift({a:t.b,b:t.a,id:t.id});
        else if (t.a === r) state.chain.push(t);
        else if (t.b === r) state.chain.push({a:t.b,b:t.a,id:t.id});
        else return;
    }

    p.hand = p.hand.filter(x => x.id !== t.id);
    state.forcedDouble = false;
    state.passCount = 0;

    if (!p.hand.length) { finish(state.turn); return; }
    state.turn = 1 - state.turn;
}

render();
if (role === 'host') send({ type: 'state', state: state });
else if (!remote) send({ type: 'action', action: a });

}

/* =========================================================
SELESAI RONDE
========================================================= */

function finish(w) {

const scores =
    state.players.map(p =>
        p.hand
            .concat(p.dead)
            .reduce(
                (s, t) => s + t.a + t.b,
                0
            )
    );


const winner =
    scores[0] === scores[1]
        ? tieWinner(0, 1)
        : scores[0] < scores[1]
            ? 0
            : 1;


state.players.forEach((p, i) => {

    p.score = scores[i];
});


state.players[winner].rounds++;

state.starter = winner;

state.round++;


document.getElementById('mTitle').textContent =
    'Ronde selesai';


document.getElementById('mBody').innerHTML =

    '<h3>' +
    state.players[winner].name +
    ' menang!</h3>' +

    '<p>' +
    state.players[0].name +
    ': ' +
    scores[0] +
    ' poin<br>' +

    state.players[1].name +
    ': ' +
    scores[1] +
    ' poin</p>';


document.getElementById('modal')
    .classList.remove('hidden');


render();


/*
   Host mengirim hasil ronde.
*/
if (role === 'host') {

    send({
        type: 'state',
        state: state
    });
}

}

/* =========================================================
PENENTU PEMENANG JIKA SKOR SAMA
========================================================= */

function tieWinner(a, b) {

const key = i =>

    state.players[i]
        .hand
        .concat(state.players[i].dead)
        .map(t => ({
            s: t.a + t.b,
            l: Math.min(t.a, t.b)
        }))
        .sort(
            (x, y) =>
                x.s - y.s ||
                x.l - y.l
        )[0] || {
            s: 0,
            l: 0
        };


const x = key(a);

const y = key(b);


return x.s !== y.s
    ? (x.s < y.s ? a : b)
    : (x.l <= y.l ? a : b);

}

/* =========================================================
TUTUP MODAL DAN MULAI RONDE BARU
========================================================= */

function closeModal() {

document.getElementById('modal')
    .classList.add('hidden');


/*
   Hanya host yang membuat ronde baru.
   Ini penting supaya kedua browser tidak
   membuat deck berbeda.
*/
if (role !== 'host') {
    return;
}


const deck = shuffle(tiles());


state.players[0].hand =
    deck.slice(0, 7);


state.players[1].hand =
    deck.slice(7, 14);


state.players.forEach(p => {

    p.dead = [];
});


state.chain = [];

state.stock = deck.slice(14);

state.passCount = 0;

state.turn = state.starter;

state.forcedDouble = true;


/*
   Jika starter tidak mempunyai double,
   giliran pindah.
*/
if (!hasDouble(state.players[state.turn])) {

    state.turn =
        1 - state.turn;
}


render();


/*
   Kirim state ronde baru ke Player 2.
*/
send({
    type: 'state',
    state: state
});

}

/* =========================================================
RENDER KARTU
========================================================= */

function pipHalf(n) {
    const pos = {1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
    return (pos[n] || []).map(i => '<span class="pip p' + i + '"></span>').join('');
}

function chainPosition(i) {
    if (i < 7) return { col: i + 1, row: 1 };
    if (i < 10) return { col: 7, row: i - 6 };
    if (i < 17) return { col: 17 - i, row: 4 };
    if (i < 20) return { col: 1, row: 20 - i };
    if (i < 27) return { col: i - 19, row: 7 };
    return { col: 7, row: 8 };
}

function tile(t, click, disabled, middle, pos) {
    const place = pos ? ' style="grid-column:' + pos.col + ';grid-row:' + pos.row + '"' : '';
    return '<div class="tile ' + (click ? 'click ' : '') + (disabled ? 'disabled ' : '') + (middle ? 'middle ' : '') + '"' + place + (click && !disabled ? ' onclick="play(\'' + t.id + '\')"' : '') + '>' + '<div class="half">' + pipHalf(t.a) + '</div><div class="half">' + pipHalf(t.b) + '</div></div>';
}

/* =========================================================
RENDER GAME
========================================================= */

function render() {

if (!state) {
    return;
}


/*
   Informasi pemain.
*/
state.players.forEach((p, i) => {

    document.getElementById('p' + i).innerHTML =

        '<h3>' +

        p.name +

        ' ' +

        (
            state.turn === i
                ? '🟡'
                : ''
        ) +

        '</h3>' +

        '<div class="score">' +

        'Kartu: <b>' +
        p.hand.length +
        '</b><br>' +

        'Cadangan: <b>' +
        (state.stock ? state.stock.length : 0) +
        '</b><br>' +

        'Menang ronde: <b>' +
        p.rounds +
        '</b><br>' +

        'Poin ronde terakhir: <b>' +
        p.score +
        '</b>' +

        '</div>';
});


/*
   Meja.
*/
document.getElementById('chain').innerHTML = state.chain.length ? state.chain.map((t,i) => tile(t,false,false,i !== 0 && i !== state.chain.length-1,chainPosition(i))).join('') : '<span class="muted">Meja kosong</span>';


/*
   Nilai ujung kiri dan kanan.
*/
document.getElementById('left').textContent =

    state.chain.length
        ? state.chain[0].a
        : '—';


document.getElementById('right').textContent =

    state.chain.length
        ? state.chain[state.chain.length - 1].b
        : '—';


/*
   Kartu milik sendiri.
*/
const p =
    state.players[myIndex];


if (!p) {
    return;
}


const playable =
    p.hand.filter(can);


const mine =
    state.turn === myIndex;


document.getElementById('turn').textContent =

    mine

        ? 'Giliran Anda — ' + p.name

        : 'Giliran ' +
          state.players[state.turn].name;


document.getElementById('status').textContent =

    mine

        ? (
            playable.length
                ? 'Pilih kartu yang cocok.'
                : 'Tidak ada yang cocok: pilih kartu untuk dibuang.'
          )

        : 'Menunggu giliran lawan...';


/* Kartu tangan sendiri. */
if (mine) {
    document.getElementById('hand').innerHTML = p.hand.map(t => {
        const isPlayable = playable.some(x => x.id === t.id);
        return tile(t, true, !isPlayable);
    }).join('');
} else {
    document.getElementById('hand').innerHTML = p.hand.map(t => tile(t,false,false)).join('');
}

const oldStock = document.getElementById('stockArea');
if (oldStock) oldStock.remove();

if (mine && !playable.length) {
    const area = document.createElement('div');
    area.id = 'stockArea';
    area.className = 'stock';
    if (state.stock.length) {
        area.innerHTML = state.stock.map(() => '<div class="stock-card" onclick="drawCard()">🁣</div>').join('');
        document.getElementById('action').textContent = 'Tidak ada kartu yang cocok. Pilih 1 kartu cadangan. Jika belum cocok, pilih lagi.';
    } else {
        area.innerHTML = '<span class="muted">Tidak ada kartu cadangan.</span>';
        document.getElementById('action').textContent = 'Tidak ada kartu yang cocok dan cadangan habis. Anda harus Lewat.';
        const btn = document.createElement('button');
        btn.className = 'secondary pass-btn';
        btn.textContent = 'Lewat';
        btn.onclick = () => apply({kind:'pass'}, false);
        area.appendChild(btn);
    }
    document.getElementById('hand').parentElement.appendChild(area);
} else {
    document.getElementById('action').textContent = mine ? 'Pilih kartu yang cocok.' : 'Menunggu giliran lawan...';
}

document.getElementById('roomLabel').textContent =
    'Room: ' + code;

}

/* =========================================================
KELUAR ROOM
========================================================= */

function leaveRoom() {

connected = false;

gameStarted = false;


try {

    if (dc) {
        dc.close();
    }

} catch (e) {}


try {

    if (peer) {
        peer.destroy();
    }

} catch (e) {}


/*
   Kembali ke halaman awal.
*/
location.reload();

}
