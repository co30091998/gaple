<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaple Guest Room</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#08151b;color:#eef7f5}
button,input{font:inherit}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#122832;border:1px solid #294954;border-radius:18px;padding:22px;box-shadow:0 12px 35px #0005}
.center{max-width:520px;margin:8vh auto}.field{margin:14px 0}.field label{display:block;color:#aac0c5;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:12px;border-radius:9px;border:1px solid #395762;background:#0b1b22;color:#fff}
.primary{background:#f4c95d;color:#162019}.secondary{background:#294b59;color:#fff}.code{font-size:35px;letter-spacing:8px;font-weight:900;background:#0b1b22;padding:15px;border-radius:12px;text-align:center;margin:15px 0}
.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.game{display:grid;grid-template-columns:210px 1fr 210px;gap:14px}.player{min-height:140px}.active{outline:2px solid #f4c95d}.score{color:#aac0c5;font-size:13px;line-height:1.7}
.board{min-height:420px;background:#0b4c43;border:8px solid #79542f;border-radius:18px;padding:18px;display:flex;flex-direction:column;justify-content:center;box-shadow:inset 0 0 35px #0007}.ends{display:flex;justify-content:space-between;font-size:13px}.chain{display:flex;overflow:auto;align-items:center;gap:4px;min-height:110px;padding:15px}
.tile{flex:0 0 48px;width:48px;height:82px;background:#f6f1df;color:#172027;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;font-weight:900;box-shadow:0 3px 6px #0005}.half{height:50%;width:100%;display:flex;align-items:center;justify-content:center;font-size:20px}.half:first-child{border-bottom:1px solid #aaa}.hand{display:flex;overflow:auto;gap:9px;padding:8px 2px 14px}.hand .tile{flex-basis:52px;width:52px;height:88px}.click{cursor:pointer}.click:hover{transform:translateY(-4px);outline:2px solid #f4c95d}.disabled{opacity:.4}.status{text-align:center;font-weight:700;margin:10px}.muted{color:#aac0c5}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px}.modal .card{max-width:500px;text-align:center;width:100%}
@media(max-width:850px){.game{grid-template-columns:1fr}.player{min-height:auto}.board{min-height:320px}}
</style></head>
<body><div class="wrap">

<section id="home" class="card center">
<h1>🁣 Gaple Guest Room</h1>
<p class="muted">Main berdua dari perangkat berbeda menggunakan kode room. Tidak perlu akun.</p>
<div class="field"><label>Nama Anda</label><input id="name" value="Guest"></div>
<button class="primary" onclick="createRoom()">Buat Room</button>
<div style="text-align:center;margin:18px">atau</div>
<div class="field"><label>Kode Room</label><input id="joinCode" placeholder="Contoh: AB7K2" maxlength="5" style="text-transform:uppercase"></div>
<button class="secondary" onclick="joinRoom()">Gabung Room</button>
<p id="homeMsg" class="muted"></p>
</section>

<section id="room" class="card center hidden">
<h2>Room dibuat</h2><p>Bagikan kode ini kepada pemain kedua:</p><div id="roomCode" class="code"></div>
<p id="roomStatus" class="muted">Menunggu pemain kedua...</p>
<button class="secondary" onclick="leaveRoom()">Keluar Room</button>
</section>

<section id="game" class="hidden">
<div class="top"><div><h1>🁣 GAPLE</h1><span id="roomLabel" class="muted"></span></div><button class="secondary" onclick="leaveRoom()">Keluar</button></div>
<div class="game">
<div id="p0" class="card player"></div>
<main>
<div class="board"><div class="ends"><span>Kiri: <b id="left">—</b></span><span>Kanan: <b id="right">—</b></span></div><div id="chain" class="chain"></div><div id="status" class="status"></div></div>
<div class="card" style="margin-top:14px"><b id="turn"></b><div id="hand" class="hand"></div><div id="action" class="muted"></div></div>
</main>
<div id="p1" class="card player"></div>
</div></section>

<div id="modal" class="modal hidden"><div class="card"><h2 id="mTitle"></h2><div id="mBody"></div><button class="primary" onclick="closeModal()">Lanjut</button></div></div>
</div>
<script>
// ===============================
// KONFIGURASI
// ===============================

const PEERJS_URL =
  "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";

let peer = null;
let dc = null;

let role = null;        // "host" atau "guest"
let code = "";
let state = null;
let myIndex = 0;
let connected = false;


// ===============================
// LOAD PEERJS
// ===============================

function loadPeerJS() {
    return new Promise((resolve, reject) => {

        if (window.Peer) {
            resolve();
            return;
        }

        const script = document.createElement("script");

        script.src = PEERJS_URL;

        script.onload = () => {
            if (window.Peer) {
                resolve();
            } else {
                reject(new Error("PeerJS gagal dimuat."));
            }
        };

        script.onerror = () => {
            reject(new Error("Tidak dapat memuat PeerJS."));
        };

        document.head.appendChild(script);
    });
}


// ===============================
// BUAT PEER
// ===============================

function createPeer(id = null) {

    return new Promise((resolve, reject) => {

        try {

            if (id) {
                peer = new Peer(id, {
                    debug: 1
                });
            } else {
                peer = new Peer({
                    debug: 1
                });
            }

            peer.on("open", peerId => {

                console.log("Peer berhasil dibuat:", peerId);

                resolve(peerId);
            });

            peer.on("error", err => {

                console.error("PeerJS Error:", err);

                reject(err);
            });

            peer.on("disconnected", () => {

                console.log("Peer terputus dari server signaling.");
            });

        } catch (err) {

            reject(err);
        }
    });
}


// ===============================
// BUAT ROOM
// ===============================

async function createRoom() {

    try {

        role = "host";
        myIndex = 0;

        // Buat kode room
        code = generateRoomCode();

        await loadPeerJS();

        // Gunakan kode room sebagai Peer ID host
        await createPeer(code);

        // Host menunggu pemain kedua
        peer.on("connection", connection => {

            console.log("Pemain kedua mencoba masuk.");

            dc = connection;

            attachDataConnection(dc);

        });

        showWaitingRoom();

    } catch (err) {

        console.error(err);

        alert(
            "Gagal membuat room.\n\n" +
            (err.message || err)
        );
    }
}


// ===============================
// GABUNG ROOM
// ===============================

async function joinRoom() {

    try {

        const input = prompt("Masukkan kode room:");

        if (!input) {
            return;
        }

        code = input.trim().toUpperCase();

        if (code.length !== 5) {

            alert("Kode room harus terdiri dari 5 karakter.");

            return;
        }

        role = "guest";
        myIndex = 1;

        await loadPeerJS();

        // Guest menggunakan Peer ID acak
        await createPeer();

        console.log("Menghubungkan ke host:", code);

        dc = peer.connect(code, {
            reliable: true
        });

        attachDataConnection(dc);

    } catch (err) {

        console.error(err);

        alert(
            "Gagal bergabung ke room.\n\n" +
            (err.message || err)
        );
    }
}


// ===============================
// DATA CONNECTION
// ===============================

function attachDataConnection(connection) {

    dc = connection;

    connection.on("open", () => {

        console.log("DataConnection terbuka.");

        connected = true;

        if (role === "host") {

            // Host membuat game
            startGame();

        } else {

            // Beritahu host bahwa guest sudah masuk
            send({
                type: "guest-ready"
            });
        }

    });

    connection.on("data", data => {

        console.log("Data diterima:", data);

        receive(data);

    });

    connection.on("close", () => {

        console.log("Koneksi ditutup.");

        connected = false;

        alert("Pemain kedua telah keluar dari permainan.");
    });

    connection.on("error", err => {

        console.error("DataConnection Error:", err);

        connected = false;
    });
}


// ===============================
// KIRIM DATA
// ===============================

function send(data) {

    if (!dc) {
        console.warn("DataConnection belum tersedia.");
        return;
    }

    if (!dc.open) {
        console.warn("DataConnection belum terbuka.");
        return;
    }

    dc.send(data);
}


// ===============================
// GENERATE KODE ROOM
// ===============================

function generateRoomCode() {

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    let result = "";

    for (let i = 0; i < 5; i++) {

        result += chars.charAt(
            Math.floor(Math.random() * chars.length)
        );
    }

    return result;
}


// ===============================
// TAMPILKAN WAITING ROOM
// ===============================

function showWaitingRoom() {

    // Sesuaikan dengan elemen HTML yang sudah ada
    const roomCodeElement =
        document.getElementById("roomCode");

    const waitingElement =
        document.getElementById("waiting");

    if (roomCodeElement) {
        roomCodeElement.textContent = code;
    }

    if (waitingElement) {
        waitingElement.style.display = "block";
    }

    console.log(
        "Room dibuat. Kode room:",
        code
    );
}


// ===============================
// MULAI GAME
// ===============================

function startGame() {

    console.log("Game dimulai.");

    state = {

        players: [
            {
                hand: []
            },
            {
                hand: []
            }
        ],

        turn: 0,

        board: [],

        finished: false
    };

    // Jika fungsi shuffle / tiles dari kode lama tersedia
    if (typeof tiles !== "undefined") {

        let deck = [...tiles];

        if (typeof shuffle === "function") {
            deck = shuffle(deck);
        }

        state.players[0].hand = deck.splice(0, 7);
        state.players[1].hand = deck.splice(0, 7);
    }

    // Kirim state awal ke pemain kedua
    send({
        type: "game-start",
        state: state
    });

    if (typeof render === "function") {
        render();
    }
}


// ===============================
// TERIMA DATA
// ===============================

function receive(data) {

    if (!data) {
        return;
    }

    switch (data.type) {

        case "guest-ready":

            if (role === "host") {

                console.log(
                    "Pemain kedua siap."
                );

                startGame();
            }

            break;


        case "game-start":

            state = data.state;

            connected = true;

            if (typeof render === "function") {
                render();
            }

            break;


        case "state":

            state = data.state;

            if (typeof render === "function") {
                render();
            }

            break;


        case "action":

            if (role === "host") {

                handleRemoteAction(data.action);

            }

            break;


        case "leave":

            connected = false;

            alert("Pemain kedua keluar dari room.");

            break;


        default:

            console.warn(
                "Tipe data tidak dikenal:",
                data.type
            );
    }
}


// ===============================
// HANDLE ACTION DARI GUEST
// ===============================

function handleRemoteAction(action) {

    if (!action) {
        return;
    }

    console.log(
        "Action dari pemain kedua:",
        action
    );

    if (action.type === "play") {

        if (typeof play === "function") {
            play(action.index);
        }

    } else if (action.type === "discard") {

        if (typeof discard === "function") {
            discard(action.index);
        }

    }
}


// ===============================
// KIRIM STATE GAME
// ===============================

function broadcastState() {

    if (role !== "host") {
        return;
    }

    send({
        type: "state",
        state: state
    });
}


// ===============================
// KIRIM ACTION
// ===============================

function sendAction(action) {

    if (role === "guest") {

        send({
            type: "action",
            action: action
        });

        return;
    }

    handleRemoteAction(action);
}


// ===============================
// MODIFIKASI PLAY
// ===============================

const originalPlay =
    typeof play === "function"
        ? play
        : null;


// ===============================
// KELUAR ROOM
// ===============================

function leaveRoom() {

    try {

        if (dc) {

            try {

                send({
                    type: "leave"
                });

            } catch (e) {}

            dc.close();
        }

        if (peer) {
            peer.destroy();
        }

    } catch (err) {

        console.error(err);
    }

    dc = null;
    peer = null;

    connected = false;
    role = null;
    code = "";
    state = null;

    console.log("Keluar room.");

    location.reload();
}


// ===============================
// HANDLE CLOSE WINDOW
// ===============================

window.addEventListener(
    "beforeunload",
    () => {

        try {

            if (dc && dc.open) {

                dc.send({
                    type: "leave"
                });
            }

        } catch (e) {}
    }
);


// ===============================
// DEBUG
// ===============================

console.log(
    "Sistem multiplayer Gaple siap."
);

</script></body></html>
