<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaple Multiplayer</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#08151b;color:#eef7f5}
button,input{font:inherit}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:#f4c95d;color:#162019}
.secondary{background:#294b59;color:#fff}
.wrap{max-width:1100px;margin:auto;padding:20px}
.card{background:#122832;border:1px solid #294954;border-radius:18px;padding:22px;box-shadow:0 12px 35px #0005}
.center{max-width:520px;margin:8vh auto}
.field{margin:14px 0}
.field label{display:block;color:#aac0c5;font-size:13px;margin-bottom:6px}
.field input{width:100%;padding:12px;border-radius:9px;border:1px solid #395762;background:#0b1b22;color:#fff}
.code{font-size:35px;letter-spacing:8px;font-weight:900;background:#0b1b22;padding:15px;border-radius:12px;text-align:center;margin:15px 0}
.hidden{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.game{display:grid;grid-template-columns:210px 1fr 210px;gap:14px}
.player{min-height:140px}
.active{outline:2px solid #f4c95d}
.score{color:#aac0c5;font-size:13px;line-height:1.7}
.board{min-height:420px;background:#0b4c43;border:8px solid #79542f;border-radius:18px;padding:18px;display:flex;flex-direction:column;justify-content:center;box-shadow:inset 0 0 35px #0007}
.ends{display:flex;justify-content:space-between;font-size:13px}
.chain{display:flex;overflow:auto;align-items:center;gap:4px;min-height:110px;padding:15px}
.tile{flex:0 0 48px;width:48px;height:82px;background:#f6f1df;color:#172027;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;font-weight:900;box-shadow:0 3px 6px #0005}
.half{height:50%;width:100%;display:flex;align-items:center;justify-content:center;font-size:20px}
.half:first-child{border-bottom:1px solid #aaa}
.hand{display:flex;overflow:auto;gap:9px;padding:8px 2px 14px}
.hand .tile{flex-basis:52px;width:52px;height:88px}
.click{cursor:pointer}
.click:hover{transform:translateY(-4px);outline:2px solid #f4c95d}
.disabled{opacity:.35;cursor:not-allowed}
.back{background:#183f4d;color:#d8edf0}
.status{text-align:center;font-weight:700;margin:10px}
.muted{color:#aac0c5}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{max-width:500px;text-align:center;width:100%}
.error{color:#ffb4b4;white-space:pre-wrap}
@media(max-width:850px){.game{grid-template-columns:1fr}.player{min-height:auto}.board{min-height:320px}}
</style>
</head>
<body>
<div class="wrap">

<section id="home" class="card center">
<h1>🁣 Gaple Multiplayer</h1>
<p class="muted">Main berdua dari perangkat berbeda menggunakan kode room.</p>

<div class="field">
<label>Nama Anda</label>
<input id="name" value="Player 1" maxlength="30">
</div>

<button id="createBtn" class="primary" onclick="createRoom()">Buat Room</button>

<div style="text-align:center;margin:18px">atau</div>

<div class="field">
<label>Kode Room</label>
<input id="joinCode" placeholder="Contoh: AB7K2" maxlength="5"
style="text-transform:uppercase">
</div>

<button id="joinBtn" class="secondary" onclick="joinRoom()">Gabung Room</button>
<p id="homeMsg" class="muted"></p>
</section>

<section id="room" class="card center hidden">
<h2 id="roomTitle">Room</h2>
<p>Bagikan kode ini kepada pemain kedua:</p>
<div id="roomCode" class="code">-----</div>
<p id="roomStatus" class="muted">Menyiapkan room...</p>
<button class="secondary" onclick="leaveRoom()">Keluar Room</button>
</section>

<section id="game" class="hidden">
<div class="top">
<div>
<h1>🁣 GAPLE</h1>
<span id="roomLabel" class="muted"></span>
</div>
<button class="secondary" onclick="leaveRoom()">Keluar</button>
</div>

<div class="game">
<div id="p0" class="card player"></div>

<main>
<div class="board">
<div class="ends">
<span>Kiri: <b id="left">—</b></span>
<span>Kanan: <b id="right">—</b></span>
</div>
<div id="chain" class="chain"></div>
<div id="status" class="status"></div>
</div>

<div class="card" style="margin-top:14px">
<b id="turn"></b>
<div id="hand" class="hand"></div>
<div id="action" class="muted"></div>
</div>
</main>

<div id="p1" class="card player"></div>
</div>
</section>

<div id="modal" class="modal hidden">
<div class="card">
<h2 id="mTitle"></h2>
<div id="mBody"></div>
<button class="primary" onclick="closeModal()">Lanjut</button>
</div>
</div>

</div>

<script>
"use strict";

/* =========================================================
   GAPLE MULTIPLAYER
   PeerJS digunakan untuk signaling.
   GitHub Pages tetap dapat digunakan karena halaman ini statis.
   ========================================================= */

const PEERJS_URL = "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";

let peer = null;
let dc = null;
let role = null;
let code = "";
let state = null;
let myIndex = -1;
let gameStarted = false;
let leaving = false;

/* =========================================================
   UTILITAS
   ========================================================= */

function $(id){
    return document.getElementById(id);
}

function msg(text){
    $("homeMsg").textContent = text || "";
}

function roomStatus(text){
    $("roomStatus").textContent = text || "";
}

function setButtons(disabled){
    $("createBtn").disabled = disabled;
    $("joinBtn").disabled = disabled;
}

function randomRoomCode(){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let result = "";
    for(let i=0;i<5;i++){
        result += chars[Math.floor(Math.random()*chars.length)];
    }
    return result;
}

function makeTiles(){
    const result = [];
    for(let a=0;a<=6;a++){
        for(let b=a;b<=6;b++){
            result.push({a,b,id:a+"-"+b});
        }
    }
    return result;
}

function shuffle(array){
    const a = [...array];
    for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
}

/* =========================================================
   LOAD PEERJS
   ========================================================= */

function loadPeerJS(){
    return new Promise((resolve,reject)=>{
        if(window.Peer){
            resolve();
            return;
        }

        const existing = document.querySelector(
            'script[data-peerjs="gaple"]'
        );

        if(existing){
            existing.addEventListener("load",()=>resolve(),{once:true});
            existing.addEventListener("error",()=>reject(
                new Error("PeerJS gagal dimuat.")
            ),{once:true});
            return;
        }

        const script = document.createElement("script");
        script.dataset.peerjs = "gaple";
        script.src = PEERJS_URL;
        script.onload = ()=>{
            if(window.Peer) resolve();
            else reject(new Error("PeerJS tidak tersedia setelah dimuat."));
        };
        script.onerror = ()=>{
            reject(new Error(
                "PeerJS tidak dapat dimuat. Pastikan perangkat terhubung ke internet."
            ));
        };
        document.head.appendChild(script);
    });
}

/* =========================================================
   PEER HOST
   ========================================================= */

function createHostPeer(){
    return new Promise((resolve,reject)=>{
        let settled = false;

        peer = new Peer(code,{
            debug: 1
        });

        peer.on("open",id=>{
            console.log("HOST PEER OPEN:",id);
            if(!settled){
                settled = true;
                resolve(id);
            }
        });

        peer.on("connection",connection=>{
            console.log("HOST menerima connection:",connection.peer);

            if(role !== "host"){
                connection.close();
                return;
            }

            if(dc && dc.open){
                connection.close();
                return;
            }

            attachConnection(connection);
        });

        peer.on("error",err=>{
            console.error("HOST PEER ERROR:",err);

            if(!settled){
                settled = true;
                reject(err);
            }

            handlePeerError(err);
        });

        peer.on("disconnected",()=>{
            console.warn("HOST PeerJS disconnected");
            if(!leaving){
                roomStatus("Koneksi server terputus. Mencoba menyambung kembali...");
                try{ peer.reconnect(); }catch(e){}
            }
        });
    });
}

/* =========================================================
   PEER GUEST
   ========================================================= */

function createGuestPeer(){
    return new Promise((resolve,reject)=>{
        let settled = false;

        peer = new Peer({
            debug: 1
        });

        peer.on("open",id=>{
            console.log("GUEST PEER OPEN:",id);

            if(!settled){
                settled = true;
                resolve(id);
            }

            connectToHost();
        });

        peer.on("error",err=>{
            console.error("GUEST PEER ERROR:",err);

            if(!settled){
                settled = true;
                reject(err);
            }

            handlePeerError(err);
        });

        peer.on("disconnected",()=>{
            console.warn("GUEST PeerJS disconnected");
            if(!leaving){
                roomStatus("Koneksi server terputus. Mencoba menyambung kembali...");
                try{ peer.reconnect(); }catch(e){}
            }
        });
    });
}

function handlePeerError(err){
    if(!err) return;

    if(err.type === "peer-unavailable"){
        roomStatus(
            "Room tidak ditemukan. Pastikan Player 1 masih menunggu dan kode benar."
        );
        return;
    }

    if(err.type === "unavailable-id"){
        roomStatus(
            "Kode room sedang digunakan. Silakan keluar lalu buat room baru."
        );
        return;
    }

    if(err.type === "network"){
        roomStatus(
            "Koneksi internet bermasalah. Periksa internet kedua perangkat."
        );
        return;
    }

    roomStatus(
        "Koneksi gagal: " + (err.message || err.type || "Unknown error")
    );
}

/* =========================================================
   CONNECT GUEST -> HOST
   ========================================================= */

function connectToHost(){
    if(!peer || !code || role !== "guest") return;

    roomStatus("Menghubungkan ke room " + code + "...");

    try{
        const connection = peer.connect(code,{
            reliable:true,
            serialization:"json"
        });

        attachConnection(connection);

    }catch(err){
        console.error(err);
        roomStatus("Gagal menghubungkan ke room.");
    }
}

/* =========================================================
   DATA CONNECTION
   ========================================================= */

function attachConnection(connection){
    dc = connection;

    connection.on("open",()=>{
        console.log("DATA CONNECTION OPEN");

        if(leaving) return;

        roomStatus("Pemain kedua terhubung.");

        if(role === "guest"){
            send({
                type:"hello",
                name:($("name").value.trim() || "Guest")
            });
        }

        if(role === "host" && !gameStarted){
            startGame();
        }
    });

    connection.on("data",data=>{
        console.log("DATA:",data);

        let message = data;

        if(typeof data === "string"){
            try{
                message = JSON.parse(data);
            }catch(e){
                console.error("Data bukan JSON:",e);
                return;
            }
        }

        receive(message);
    });

    connection.on("close",()=>{
        console.warn("DATA CONNECTION CLOSED");

        if(!leaving){
            dc = null;
            $("status").textContent =
                "Pemain lain terputus dari permainan.";
            roomStatus(
                "Pemain lain terputus dari room."
            );
        }
    });

    connection.on("error",err=>{
        console.error("DATA CONNECTION ERROR:",err);
        if(!leaving){
            roomStatus(
                "Koneksi pemain bermasalah."
            );
        }
    });
}

function send(data){
    if(!dc || !dc.open){
        console.warn("Data connection belum terbuka.");
        return false;
    }

    try{
        dc.send(data);
        return true;
    }catch(err){
        console.error("Gagal mengirim:",err);
        return false;
    }
}

/* =========================================================
   CREATE ROOM
   ========================================================= */

async function createRoom(){
    if(peer || dc) return;

    setButtons(true);
    msg("");
    role = "host";
    myIndex = 0;
    gameStarted = false;
    leaving = false;

    code = randomRoomCode();

    $("roomCode").textContent = code;
    $("roomTitle").textContent = "Room dibuat";
    $("home").classList.add("hidden");
    $("room").classList.remove("hidden");

    roomStatus("Menghubungkan ke server...");

    try{
        await loadPeerJS();
        await createHostPeer();

        roomStatus(
            "Menunggu pemain kedua... Bagikan kode " + code
        );

    }catch(err){
        console.error("createRoom:",err);

        roomStatus(
            "Gagal membuat room: " +
            (err.message || err)
        );

        setButtons(false);

        try{
            if(peer) peer.destroy();
        }catch(e){}

        peer = null;
    }
}

/* =========================================================
   JOIN ROOM
   ========================================================= */

async function joinRoom(){
    if(peer || dc) return;

    const input = $("joinCode").value
        .trim()
        .toUpperCase();

    if(input.length !== 5){
        msg("Kode room harus terdiri dari 5 karakter.");
        return;
    }

    setButtons(true);
    msg("");

    role = "guest";
    myIndex = 1;
    gameStarted = false;
    leaving = false;
    code = input;

    $("roomCode").textContent = code;
    $("roomTitle").textContent = "Bergabung ke Room";
    $("home").classList.add("hidden");
    $("room").classList.remove("hidden");

    roomStatus(
        "Menyiapkan koneksi..."
    );

    try{
        await loadPeerJS();
        await createGuestPeer();

    }catch(err){
        console.error("joinRoom:",err);

        roomStatus(
            "Gagal bergabung: " +
            (err.message || err)
        );

        setButtons(false);

        try{
            if(peer) peer.destroy();
        }catch(e){}

        peer = null;
    }
}

/* =========================================================
   START GAME
   ========================================================= */

function startGame(){
    if(gameStarted || role !== "host" || !dc || !dc.open){
        return;
    }

    gameStarted = true;

    const deck = shuffle(makeTiles());

    state = {
        players:[
            {
                name:$("name").value.trim() || "Player 1",
                hand:deck.slice(0,14),
                dead:[],
                score:0,
                rounds:0
            },
            {
                name:"Player 2",
                hand:deck.slice(14,28),
                dead:[],
                score:0,
                rounds:0
            }
        ],
        chain:[],
        turn:0,
        starter:0,
        round:1,
        forcedDouble:true,
        started:true
    };

    showGame();

    send({
        type:"state",
        state:state
    });

    render();
}

/* =========================================================
   RECEIVE
   ========================================================= */

function receive(message){
    if(!message || !message.type) return;

    if(message.type === "hello"){
        if(role !== "host" || !state) return;

        state.players[1].name =
            message.name || "Player 2";

        send({
            type:"state",
            state:state
        });

        render();
        return;
    }

    if(message.type === "state"){
        if(!message.state) return;

        state = message.state;
        gameStarted = true;

        showGame();
        render();
        return;
    }

    if(message.type === "action"){
        if(role !== "host" || !state) return;

        applyAction(message.action,true);
        return;
    }

    if(message.type === "leave"){
        if(!leaving){
            roomStatus("Pemain lain keluar dari room.");
            $("status").textContent =
                "Pemain lain telah keluar.";
        }
    }
}

/* =========================================================
   GAME RULES
   ========================================================= */

function hasDouble(player){
    return player.hand.some(t=>t.a === t.b);
}

function canPlay(tile){
    if(!state) return false;

    if(!state.chain.length){
        if(state.forcedDouble){
            return tile.a === tile.b;
        }
        return true;
    }

    const left = state.chain[0].a;
    const right =
        state.chain[state.chain.length-1].b;

    return (
        tile.a === left ||
        tile.b === left ||
        tile.a === right ||
        tile.b === right
    );
}

function play(id){
    if(!state) return;

    if(state.turn !== myIndex) return;

    const player = state.players[myIndex];
    const tile = player.hand.find(t=>t.id === id);

    if(!tile || !canPlay(tile)) return;

    applyAction({
        kind:"play",
        id:id
    },false);
}

function discard(id){
    if(!state) return;

    if(state.turn !== myIndex) return;

    const player = state.players[myIndex];

    if(player.hand.some(canPlay)){
        return;
    }

    const tile = player.hand.find(t=>t.id === id);

    if(!tile) return;

    applyAction({
        kind:"discard",
        id:id
    },false);
}

function applyAction(action,remote){
    if(!state || !action) return;

    const player = state.players[state.turn];

    if(!player) return;

    if(action.kind === "play"){
        const tile = player.hand.find(
            t=>t.id === action.id
        );

        if(!tile || !canPlay(tile)) return;

        if(!state.chain.length){
            state.chain = [tile];
        }else{
            const left = state.chain[0].a;
            const right =
                state.chain[state.chain.length-1].b;

            if(tile.b === left){
                state.chain.unshift(tile);
            }else if(tile.a === left){
                state.chain.unshift({
                    a:tile.b,
                    b:tile.a,
                    id:tile.id
                });
            }else if(tile.a === right){
                state.chain.push(tile);
            }else if(tile.b === right){
                state.chain.push({
                    a:tile.b,
                    b:tile.a,
                    id:tile.id
                });
            }else{
                return;
            }
        }

        player.hand =
            player.hand.filter(t=>t.id !== tile.id);

        state.forcedDouble = false;

    }else if(action.kind === "discard"){
        const tile = player.hand.find(
            t=>t.id === action.id
        );

        if(!tile) return;

        if(player.hand.some(canPlay)){
            return;
        }

        player.hand =
            player.hand.filter(t=>t.id !== tile.id);

        player.dead.push(tile);
    }

    if(player.hand.length === 0){
        finish(state.turn);
        return;
    }

    state.turn = 1 - state.turn;

    render();

    if(!remote){
        if(role === "guest"){
            send({
                type:"action",
                action:action
            });
        }else{
            send({
                type:"action",
                action:action
            });
        }
    }
}

/* =========================================================
   ROUND END
   ========================================================= */

function finish(winnerByEmptyHand){
    const scores = state.players.map(player=>{
        return player.hand
            .concat(player.dead)
            .reduce((sum,t)=>sum+t.a+t.b,0);
    });

    let winner = winnerByEmptyHand;

    if(scores[0] === scores[1]){
        winner = tieWinner(0,1);
    }else{
        winner = scores[0] < scores[1] ? 0 : 1;
    }

    state.players.forEach((player,i)=>{
        player.score = scores[i];
    });

    state.players[winner].rounds++;
    state.starter = winner;
    state.round++;

    $("mTitle").textContent = "Ronde selesai";

    $("mBody").innerHTML =
        "<h3>"+escapeHtml(
            state.players[winner].name
        )+" menang!</h3>"+
        "<p>"+
        escapeHtml(state.players[0].name)+
        ": <b>"+scores[0]+"</b> poin<br>"+
        escapeHtml(state.players[1].name)+
        ": <b>"+scores[1]+"</b> poin</p>";

    $("modal").classList.remove("hidden");

    render();

    if(role === "host"){
        send({
            type:"state",
            state:state
        });
    }
}

function tieWinner(a,b){
    function key(index){
        const cards =
            state.players[index]
                .hand
                .concat(state.players[index].dead);

        if(!cards.length){
            return {s:0,l:0};
        }

        return cards
            .map(t=>({
                s:t.a+t.b,
                l:Math.min(t.a,t.b)
            }))
            .sort((x,y)=>x.s-y.s || x.l-y.l)[0];
    }

    const x = key(a);
    const y = key(b);

    if(x.s !== y.s){
        return x.s < y.s ? a : b;
    }

    return x.l <= y.l ? a : b;
}

function closeModal(){
    $("modal").classList.add("hidden");

    if(role !== "host") return;

    const deck = shuffle(makeTiles());

    state.players[0].hand = deck.slice(0,14);
    state.players[1].hand = deck.slice(14,28);

    state.players.forEach(p=>{
        p.dead = [];
    });

    state.chain = [];
    state.turn = state.starter;
    state.forcedDouble = true;

    if(!hasDouble(state.players[state.turn])){
        state.turn = 1 - state.turn;
    }

    render();

    send({
        type:"state",
        state:state
    });
}

/* =========================================================
   DISPLAY
   ========================================================= */

function showGame(){
    $("room").classList.add("hidden");
    $("home").classList.add("hidden");
    $("game").classList.remove("hidden");
}

function escapeHtml(value){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function tileHtml(tile,clickable,disabled){
    const classes =
        "tile " +
        (clickable ? "click " : "") +
        (disabled ? "disabled" : "");

    const click =
        clickable && !disabled
        ? ' onclick="play(\''+
          escapeHtml(tile.id)+
          '\')"'
        : "";

    return (
        '<div class="'+classes+'"'+click+'>'+
            '<div class="half">'+tile.a+'</div>'+
            '<div class="half">'+tile.b+'</div>'+
        '</div>'
    );
}

function backTileHtml(){
    return (
        '<div class="tile back">'+
            '<div class="half">●</div>'+
            '<div class="half">●</div>'+
        '</div>'
    );
}

function render(){
    if(!state) return;

    state.players.forEach((player,index)=>{
        const active =
            state.turn === index
            ? " active"
            : "";

        $("p"+index).className =
            "card player"+active;

        let content =
            "<h3>"+
            escapeHtml(player.name)+
            (state.turn===index ? " 🟡" : "")+
            "</h3>"+
            '<div class="score">'+
            "Kartu: <b>"+player.hand.length+"</b><br>"+
            "Dead: <b>"+player.dead.length+"</b><br>"+
            "Menang ronde: <b>"+player.rounds+"</b><br>"+
            "Poin terakhir: <b>"+player.score+"</b>"+
            "</div>";

        $("p"+index).innerHTML = content;
    });

    $("chain").innerHTML =
        state.chain.length
        ? state.chain.map(t=>tileHtml(t,false,false)).join("")
        : '<span class="muted">Meja kosong</span>';

    $("left").textContent =
        state.chain.length
        ? state.chain[0].a
        : "—";

    $("right").textContent =
        state.chain.length
        ? state.chain[state.chain.length-1].b
        : "—";

    const mine = state.players[myIndex];

    if(!mine) return;

    const myTurn = state.turn === myIndex;

    const playable =
        mine.hand.filter(canPlay);

    $("turn").textContent =
        myTurn
        ? "Giliran Anda — "+mine.name
        : "Giliran "+state.players[state.turn].name;

    $("status").textContent =
        myTurn
        ? (
            playable.length
            ? "Pilih kartu yang cocok."
            : "Tidak ada kartu yang cocok. Pilih kartu untuk dibuang."
        )
        : "Menunggu giliran lawan...";

    if(myTurn && playable.length){
        $("hand").innerHTML =
            mine.hand.map(t=>{
                const ok =
                    playable.some(x=>x.id===t.id);

                return tileHtml(t,true,!ok);
            }).join("");

        $("action").textContent = "";
    }else if(myTurn && !playable.length){
        $("hand").innerHTML =
            mine.hand.map(t=>
                '<div class="tile click" onclick="discard(\''+
                escapeHtml(t.id)+
                '\')">'+
                '<div class="half">'+t.a+'</div>'+
                '<div class="half">'+t.b+'</div>'+
                '</div>'
            ).join("");

        $("action").textContent =
            "Tidak ada kartu yang dapat dimainkan. Klik satu kartu untuk membuangnya.";
    }else{
        $("hand").innerHTML =
            mine.hand.map(()=>backTileHtml()).join("");

        $("action").textContent = "";
    }

    $("roomLabel").textContent =
        "Room: "+code;
}

/* =========================================================
   LEAVE ROOM
   ========================================================= */

function leaveRoom(){
    if(leaving) return;

    leaving = true;

    try{
        if(dc && dc.open){
            dc.send({type:"leave"});
        }
    }catch(e){}

    try{
        if(dc) dc.close();
    }catch(e){}

    try{
        if(peer) peer.destroy();
    }catch(e){}

    dc = null;
    peer = null;
    state = null;
    role = null;
    code = "";
    myIndex = -1;
    gameStarted = false;

    location.reload();
}

window.addEventListener("beforeunload",()=>{
    if(!dc || !dc.open) return;

    try{
        dc.send({type:"leave"});
    }catch(e){}
});

console.log("Gaple Multiplayer siap.");
